name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - README.md
      - '.github/topics.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Generate static catalog
        run: npx --yes --package=@jnv/lists-manage@latest lists-manage export --file README.md --config .github/topics.json --output "$RUNNER_TEMP/catalog"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/catalog
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
